name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/food-safety-gmp-app-akypj5
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# يسمح بنشر واحد فقط في كل مرة
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
