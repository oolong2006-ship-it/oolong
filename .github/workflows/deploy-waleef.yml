name: Deploy Waleef to Vercel

# ينشر تطبيق وليف (مجلد waleef/) تلقائيًا على Vercel.
# يحتاج إضافة 3 أسرار في المستودع: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# لو الأسرار غير موجودة، تتخطى المهمة بهدوء وتبقى الـ CI خضراء.

on:
  push:
    branches:
      - claude/waleef-ai-companion-mvp-qtde65
    paths:
      - "waleef/**"
      - ".github/workflows/deploy-waleef.yml"
  workflow_dispatch:

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waleef
    steps:
      - name: Notice when secrets are missing
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::notice title=Vercel not configured::أضف الأسرار VERCEL_TOKEN و VERCEL_ORG_ID و VERCEL_PROJECT_ID لتفعيل النشر. تم تخطّي هذه المهمة."

      - name: Checkout
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed to: $url"
          echo "### 🌿 وليف منشور: $url" >> "$GITHUB_STEP_SUMMARY"
