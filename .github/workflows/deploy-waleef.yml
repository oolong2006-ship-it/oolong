name: Deploy Waleef to Vercel

# ينشر تطبيق وليف (مجلد waleef/) تلقائيًا على Vercel.
# يحتاج سرًّا واحدًا فقط في المستودع: VERCEL_TOKEN
# (Vercel ينشئ المشروع تلقائيًا عند أول نشر.)
# لو السر غير موجود، تتخطى المهمة بهدوء وتبقى الـ CI خضراء.

on:
  push:
    branches:
      - claude/waleef-ai-companion-mvp-qtde65
    paths:
      - "waleef/**"
      - ".github/workflows/deploy-waleef.yml"
  workflow_dispatch:

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waleef
    steps:
      - name: Notice when the token is missing
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::notice title=Vercel not configured::أضف السر VERCEL_TOKEN في إعدادات المستودع لتفعيل النشر التلقائي. تم تخطّي هذه المهمة."

      - name: Checkout
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          url=$(vercel deploy --prod --yes --cwd . --token="$VERCEL_TOKEN")
          echo "Deployed to: $url"
          echo "### 🌿 وليف منشور بنجاح" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**رابط التطبيق:** $url" >> "$GITHUB_STEP_SUMMARY"
