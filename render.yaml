# Render Blueprint — Franchise Ready AI
# نشر شبه تلقائي: يُنشئ قاعدة البيانات ويربطها ويولّد المفاتيح دون أي إدخال يدوي.
services:
  - type: web
    name: franchise-ready-ai
    runtime: node
    plan: free
    rootDir: franchise-ready-ai
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: VAT_RATE
        value: "0.15"
      - key: PRICE_SAR
        value: "1999"
      - key: PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING
        value: "1"
      - key: NODE_VERSION
        value: "20"
