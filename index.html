<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>نظام سلامة الغذاء و GMP | إدارة الجودة والتفتيش</title>
  <meta name="description" content="نظام احترافي لإدارة الجودة وسلامة الغذاء وممارسات التصنيع الجيدة GMP للمطاعم والكافيهات والمصانع الغذائية الخاضعة للتفتيش والرقابة." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- شاشة تسجيل الدخول -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">🛡️</div>
        <h1>نظام سلامة الغذاء و GMP</h1>
        <p>منصة إدارة الجودة والتفتيش للمنشآت الغذائية</p>
      </div>
      <div class="login-roles">
        <p class="login-hint">اختر الدور للدخول التجريبي:</p>
        <button class="role-btn" data-role="مدير الجودة">👔 مدير الجودة</button>
        <button class="role-btn" data-role="مشرف سلامة غذاء">🧪 مشرف سلامة الغذاء</button>
        <button class="role-btn" data-role="مفتش">🔍 مفتش / مراقب</button>
      </div>
      <p class="login-foot">يعمل بدون اتصال — تُحفظ البيانات على جهازك</p>
    </div>
  </div>

  <!-- التطبيق -->
  <div id="app" class="app hidden">
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">🛡️</span>
        <div>
          <strong>سلامة الغذاء</strong>
          <small>GMP &amp; HACCP</small>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="user-badge" id="user-badge"></div>
        <button class="btn-ghost" id="logout-btn">تسجيل الخروج</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-toggle" aria-label="القائمة">☰</button>
        <div class="topbar-title" id="page-title">لوحة المعلومات</div>
        <div class="topbar-actions">
          <span class="today-chip" id="today-chip"></span>
          <button class="btn-secondary" id="export-btn" title="تصدير نسخة احتياطية">⬇ <span class="lbl">تصدير</span></button>
          <button class="btn-secondary" id="import-btn" title="استيراد نسخة احتياطية">⬆ <span class="lbl">استيراد</span></button>
          <input type="file" id="import-file" accept="application/json" hidden />
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- نافذة منبثقة عامة -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">عنوان</h3>
        <button class="icon-btn" id="modal-close" aria-label="إغلاق">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/standards.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
